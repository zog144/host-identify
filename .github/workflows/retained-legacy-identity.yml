name: Retained legacy STATE identity source compatibility
on:
  push:
    branches: [regular/retained-legacy-state-identity-035-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . 'pytest>=8,<10'
      - run: python -m pip check
      - name: Exercise original-key, same-inode restart and unsafe migrations
        run: sudo --preserve-env=PATH "$(command -v python)" -m pytest -q -ra tests/test_retained_legacy.py
      - if: always()
        run: echo 'Only disposable root-owned receipt and synthetic identity. No native migration, real STATE, Host key, enrollment or credentials modified.' >> "$GITHUB_STEP_SUMMARY"
