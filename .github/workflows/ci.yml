name: CI
on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public source boundary
        run: |
          test ! -e AGENTS.md
          test ! -e COPYRIGHT
          test ! -e version-share-handoff.json
          test -f LICENSE
          test -f LICENSES/BSD-3-Clause.txt
          test -f LICENSES/GPL-3.0-only.txt
      - name: Install component and pytest
        run: python -m pip install . 'pytest>=8,<10'
      - name: Run synthetic security tests
        run: python -m pytest -q tests
      - name: Verify namespace ownership
        run: |
          test ! -e src/zog/__init__.py
          python -c 'import zog.host_identify as h; assert h.__version__ == "0.3.4"'

  package-artifacts:
    name: Namespace and license artifact audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Audit wheel and source distribution
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile
          wheel = glob.glob('dist/*.whl')
          sdist = glob.glob('dist/*.tar.gz')
          assert len(wheel) == len(sdist) == 1
          with zipfile.ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
              assert 'zog/host_identify/__init__.py' in names
              assert 'zog/__init__.py' not in names
              assert not any(n.startswith('tests/') for n in names)
              assert any(n.endswith('/LICENSE') or n == 'LICENSE' for n in names)
          with tarfile.open(sdist[0], 'r:gz') as archive:
              names = archive.getnames()
              prefix = names[0].split('/', 1)[0]
              files = {n[len(prefix)+1:] for n in names if n.startswith(prefix + '/')}
              for path in ('LICENSE', 'LICENSES/BSD-3-Clause.txt',
                           'LICENSES/GPL-3.0-only.txt', 'THIRD-PARTY-NOTICES.md',
                           'docs/host-identify/README.md', 'tests/test_namespace.py',
                           'src/zog/host_identify/__init__.py'):
                  assert path in files, path
              assert 'COPYRIGHT' not in files
              assert 'version-share-handoff.json' not in files
          PY
